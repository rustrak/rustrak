[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # Marvin Attack in `rsa`, a required dependency of `openidconnect`. It leaks
    # private-key operations through timing; Rustrak only verifies ID token
    # signatures with the provider's public key and never holds an RSA private
    # key. No patched release exists yet: drop this once `rsa` ships one.
    { id = "RUSTSEC-2023-0071", reason = "only RSA public-key verification is used (OIDC ID tokens)" },
    # Timing side channels in `crypto-bigint` 0.5, pulled in by `openidconnect`
    # through `p256`/`p384`. Rustrak only verifies ID token signatures with the
    # provider's public key; no secret ever goes through it. The fix is 0.7.6,
    # which `openidconnect` 4 cannot use yet: drop this once it moves to it.
    { id = "RUSTSEC-2026-0387", reason = "only ECDSA public-key verification is used (OIDC ID tokens)" },
    # `zip` 7, pulled in by `symbolic-debuginfo` (up to 13.9 it requires ^7.2):
    # all four are in `ZipArchive::extract` / `ZipStreamReader::extract`,
    # which neither symbolic nor Rustrak calls; both only read entries. Rustrak's
    # own `zip` is 9. Drop these once symbolic moves to zip 9.
    { id = "RUSTSEC-2026-0367", reason = "zip 7 extract() is never called (symbolic-debuginfo reads entries only)" },
    { id = "RUSTSEC-2026-0368", reason = "zip 7 extract() is never called (symbolic-debuginfo reads entries only)" },
    { id = "RUSTSEC-2026-0369", reason = "zip 7 extract() is never called (symbolic-debuginfo reads entries only)" },
    { id = "RUSTSEC-2026-0429", reason = "zip 7 extract() is never called (symbolic-debuginfo reads entries only)" },
    # `zstd` 0.13 / `zstd-safe` 7, pulled in by `symbolic-debuginfo` (up to
    # 14.0-alpha it requires ^0.13.1), which only calls `zstd::bulk::decompress`
    # on compressed ELF sections. 0391 is `with_context` stream reuse, 0398
    # needs the `seekable` feature (not enabled), and 0403's own text exempts
    # the bulk API. Rustrak's own `zstd` is 0.14.3. Drop these once symbolic
    # moves to zstd 0.14.
    { id = "RUSTSEC-2026-0391", reason = "zstd 0.13 is only used through the bulk API (symbolic-debuginfo); no with_context streams" },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe 7 seekable feature is not enabled" },
    { id = "RUSTSEC-2026-0403", reason = "zstd 0.13 is only used through the bulk API (symbolic-debuginfo), which the advisory exempts" },
]
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "CDLA-Permissive-2.0",
    "AGPL-3.0-only",
    # nom-supreme, brownstone, indent_write (via symbolic-debuginfo). MPL-2.0
    # is compatible with the GNU licences (MPL 2.0 section 3.3).
    "MPL-2.0",
]
private = { ignore = true }

# zstd-sys uses "MIT/Apache-2.0" (slash = non-SPDX) instead of SPDX "MIT OR Apache-2.0".
# cargo-deny can't parse the slash form, so we clarify it manually using the actual license files.
[[licenses.clarify]]
name = "zstd-sys"
expression = "MIT OR Apache-2.0"
license-files = [
    { path = "LICENSE.Mit", hash = 0x94c25aa8 },
    { path = "LICENSE.Apache-2.0", hash = 0x1ea3b7b0 },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
