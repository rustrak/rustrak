<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
    <!--
      English until the reader's locale is known: `Messages` then sets `lang`,
      and each page renders its own <title>.
    -->
    <title>Rustrak - Error Tracking System</title>
    <meta
      name="description"
      content="Lightweight, self-hosted error tracking compatible with Sentry SDKs"
    />
    <!--
      `dark` on <html> above is the same default `ThemeProvider` carries
      (`defaultTheme="dark"`), so the first paint is already dark rather than
      white until React mounts and swaps the class.
    -->
  </head>
  <body class="antialiased min-h-screen flex flex-col">
    <div id="root" class="min-h-screen flex flex-col flex-1"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
