<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
    <!--
      The title and `lang` are what the Next app rendered per request out of the
      message catalogue. A static shell has no request, so English is the
      starting value and `<DocumentLanguage>` replaces both once the reader's
      locale is known. Anything a crawler would read is behind a login anyway.
    -->
    <title>Rustrak - Error Tracking System</title>
    <meta
      name="description"
      content="Lightweight, self-hosted error tracking compatible with Sentry SDKs"
    />
    <!--
      `dark` on <html> above is the default `ThemeProvider` carries, so a first
      visit paints dark from the first frame. A reader who chose otherwise has
      it in `localStorage.theme` (next-themes' key), and this applies it before
      the stylesheet paints. next-themes' own script does the same thing but
      only runs in a server-rendered document.
    -->
    <script>
      (() => {
        let theme = null;
        try {
          theme = localStorage.getItem('theme');
          if (theme === 'system') {
            theme = matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          }
          if (theme === 'light') {
            document.documentElement.classList.replace('dark', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch {}
      })();
    </script>
  </head>
  <body class="antialiased min-h-screen flex flex-col">
    <div id="root" class="min-h-screen flex flex-col flex-1"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
