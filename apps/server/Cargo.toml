[package]
name = "rustrak"
version = "0.15.0"
edition = "2021"
authors = ["Rustrak Team"]
description = "Ultra-lightweight error tracking server compatible with Sentry SDKs"
license = "GPL-3.0-only"

[dependencies]
# Web framework (HTTP/2 is disabled until Actix moves to h2 0.4.)
actix-web = { version = "4.15.0", default-features = false, features = [
    "macros",
    "compress-brotli",
    "compress-gzip",
    "compress-zstd",
    "cookies",
    "unicode",
] }
actix-rt = "2.15.0"

# Static file serving for the compiled dashboard. Optional at runtime: the
# server mounts it only when a build is actually present on disk.
actix-files = "0.7.0"

# Session management
actix-session = { version = "0.11", features = ["cookie-session"] }

# Password hashing
argon2 = "0.6.0"

# Async runtime
tokio = { version = "1.53.1", features = ["full"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Logging
env_logger = "0.11.11"
log = "0.4.34"

# Environment
dotenvy = "0.15.7"

# Time
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
# time 0.3.48 broke cookie 0.16.2 (E0119 blanket impl conflict); fixed upstream by 0.3.53 with cookie still on 0.16.
time = "=0.3.53"

# Database
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "tls-rustls",
    "uuid",
    "chrono",
    "migrate",
] }

# UUID generation
uuid = { version = "1.26.1", features = ["v4", "serde"] }

# Slug generation
slug = "0.1.6"

# Error handling
thiserror = "2.0.21"

# Random number generation for tokens
rand = "0.10.3"

# Hex encoding
hex = "0.4.3"

# Compression (for decompressing gzip/deflate/brotli/zstd payloads)
flate2 = "1.1.10"
# brotli and zstd held at the versions actix-http 3.18 depends on; going past
# them compiles a second copy of each. Bump together with actix-http.
brotli = "8.0.4"
zstd = "0.13.3"

# Async utilities
futures-util = "0.3.34"
bytes = "1.12.1"


# Hashing (for grouping key hash)
sha2 = "0.11.0"

# formatting edge cases match.
dynfmt = { version = "0.2", features = ["python", "curly"] }

# Message parameterization for grouping. `fancy-regex` rather than `regex`
# because Sentry's patterns lean on lookbehind and lookahead, which `regex`
# does not support.
fancy-regex = "0.19"

# IP address handling (stored as string for SQLite compat)
# ipnetwork removed - store IP as String for multi-DB support

# CORS support
actix-cors = "0.7.2"

# Base64 encoding for pagination cursors
base64 = "0.23.1"

# HTTP client for notifications
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }

# HMAC for webhook signatures
hmac = "0.13.0"

# Template rendering for custom webhook bodies (minijinja: pure Rust, no codegen)
minijinja = { version = "2", features = ["json", "fuel"] }

# URL parsing/validation
url = "2.5.8"

# Async trait support
async-trait = "0.1.92"

# Source map processing
sourcemap = "9"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }  # CVE-2025-29787 fixed in 2.3+; DO NOT lower below 2.3; no zstd (non-SPDX license)
actix-multipart = "0.8"
sha1 = "0.11"
tempfile = "3.27.0"

# Email sending
lettre = { version = "0.11.23", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "builder", "smtp-transport"] }

# Global allocator. glibc malloc keeps one arena per thread and never gives an
# arena back once its thread exits; the blocking pool creates and retires threads
# on every burst, so RSS climbed to the arena limit and stayed there.
mimalloc = "0.1.52"

# OpenAPI spec generation (optional, behind `openapi` feature flag)
utoipa = { version = "6.0.0", features = ["actix_extras", "uuid", "chrono"], optional = true }
utoipa-scalar = { version = "0.4.0", features = ["actix-web"], optional = true }

[dev-dependencies]
# The crate depends on itself so the integration tests, which are separate
# crates, get `test-seams` enabled. Gating the seams on `debug_assertions`
# instead made `cargo test --release` fail to compile.
rustrak = { path = ".", default-features = false, features = ["test-seams"] }

# Test framework & fixtures
rstest = "0.27.0"
serial_test = "4.0.1"

# Note: reqwest available from main dependencies

# Database testing with real PostgreSQL containers
# testcontainers held at 0.27: testcontainers-modules 0.15 (latest) still requires
# testcontainers ^0.27, and 0.28 pulls bollard 0.21 whose pinned bollard-stubs
# conflicts with bollard 0.20's. Bump once testcontainers-modules supports 0.28.
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }

# Sentry SDK for E2E tests
sentry = { version = "0.49.3", features = ["test"] }

# Property-based testing
proptest = "1.11.0"

# Better assertion diffs
pretty_assertions = "1.4.1"

# tempfile moved to [dependencies] (needed at runtime for assembly)

[[bin]]
name = "rustrak"
path = "src/main.rs"

[[bin]]
name = "gen_openapi"
path = "src/bin/gen_openapi.rs"
required-features = ["openapi"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# panic = "abort" is intentionally disabled:
# actix-web uses catch_unwind per request to isolate handler panics and return HTTP 500.
# With panic = "abort", that safety net is silently bypassed and any panic kills the entire
# process — which is unacceptable for a server that must stay always on.
#panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[features]
default = ["sqlite"]
postgres = ["sqlx/postgres"]
sqlite = ["sqlx/sqlite"]
openapi = ["dep:utoipa", "dep:utoipa-scalar"]
# Compiles the `ProjectService` test seams (`create_with_stale_slug` and the two
# race helpers). Never enabled for the shipped binary: the self dev-dependency
# below turns it on for test targets only, so `cargo test --release` builds
# while `cargo build --release` still cannot reach them.
test-seams = []
