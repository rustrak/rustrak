services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rustrak
      POSTGRES_PASSWORD: rustrak
      POSTGRES_DB: rustrak
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rustrak -d rustrak"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Built from source with the postgres feature. It serves the dashboard only
  # if apps/server/static holds a build (`pnpm build --filter=@rustrak/server`
  # puts one there); for dashboard work, run `pnpm dev` in apps/dashboard
  # instead, on :3000.
  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
      args:
        FEATURES: postgres
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - RUST_LOG=info
      - DATABASE_URL=postgres://rustrak:rustrak@postgres:5432/rustrak
      - SESSION_SECRET_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - CREATE_SUPERUSER=admin@admin.com:password123
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:${SERVER_PORT:-8080}}
    volumes:
      - rustrak_data:/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  rustrak_data:
