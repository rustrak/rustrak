# The Rust CI and the release images compile with. The server image takes its
# toolchain from the cargo-chef tag in apps/server/Dockerfile, which CI checks
# against this channel; bump both together.
[toolchain]
channel = "1.98"
components = ["rustfmt", "clippy"]
# Plugins compile to WebAssembly components (`plugins/`, and the server's tests build them).
targets = ["wasm32-wasip2"]
profile = "minimal"
