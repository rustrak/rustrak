name: CI

# Two toolchains, two runners, nothing in common.
#
# The JavaScript side and the Rust side used to share one job, one 4-core
# runner and one `turbo run` that ran `cargo test`, `cargo clippy`, `cargo
# check` and `cargo build --release` side by side. Turbo believes cargo tasks
# run in parallel; cargo does not: they queue on the target directory lock
# ("Blocking waiting for file lock on build directory"), so the four Rust tasks
# ran one after the other, with Vitest fighting them for the same cores. And
# the release build, the one task that produced nothing any check read, was
# 10m50s of a 12m56s run: fat LTO with one codegen unit is a single-threaded
# tail that no runner can parallelise.
#
# So: `web` runs turbo for the JavaScript packages only. `rust` runs cargo
# directly and compiles the crate exactly once, in the test profile, with the
# `openapi` feature on so the spec check afterwards is a cache hit rather than
# a second compile with a different feature set. Release binaries are built by
# docker-publish.yml, which is the only place anything reads them.

on:
  # Every pull request, whatever it targets. Deliberately unfiltered: a `branches`
  # filter here matches the PR's *base*, so gating on `main` meant a stacked PR
  # or one onto a long-lived feature branch merged with no checks at all. The
  # work is the same work regardless of where it lands.
  pull_request:
  # Also on the two branches PRs land on. GitHub scopes the Actions cache to
  # the branch that wrote it plus the PR's base branch, so a PR can only read
  # caches its base branch saved. Nothing ran on `main` or `next` before, so
  # no base branch ever had one and every new branch compiled from zero. These
  # are the runs that write the caches PRs read; they also tell us the merge
  # commit itself passes.
  push:
    branches: [main, next]

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a PR supersedes the one running. A push to main or next
  # is left to finish: it is the run that writes the shared caches.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation trades a slower first build for faster rebuilds
  # of the same tree. CI never rebuilds the same tree.
  CARGO_INCREMENTAL: "0"
  # Debug info roughly doubles the size of the target directory, which is what
  # the cache restores and saves. A failing test still names its file and
  # line, since that comes from the panic location, not from debug info.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # Skip the automated "chore: version packages" PR, on main or on a prerelease
  # branch (the head is `changeset-release/<branch>`). It only bumps versions and
  # writes changelogs, generated by changesets from commits that already passed
  # CI. A job skipped by `if` reports as successful to branch protection, so
  # required checks still go green. `head_ref` is empty on non-PR events, so
  # this never blocks a push run.
  #
  # The same-repo check is what keeps the skip from being a bypass: a fork can
  # name its branch anything, but it cannot make its head repository ours.
  web:
    if: ${{ !(startsWith(github.head_ref, 'changeset-release/') && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The version the Docker images run on. `latest` resolved to a
          # different Node on every runner refresh and nothing else in the
          # repo was tested against it.
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm install` brings the `playwright` package but not the browser it
      # drives: the binary lands in ~/.cache/ms-playwright and is downloaded
      # separately. `@rustrak/ui` runs every story as a component test in a real
      # Chromium, so without this the whole suite fails at `browserType.launch`.
      # Cached on the lockfile, which is what pins the Playwright version.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      # A no-op when the cache hit, and the download when it did not. `--with-deps`
      # also installs the system libraries Chromium needs on the runner.
      - run: pnpm --filter @rustrak/ui exec playwright install --with-deps chromium

      # build, test, lint, format:check, check-types and react-doctor for every
      # package except the two Rust crates, which have their own job below.
      - run: pnpm run ci:web

  # The default feature set, `sqlite`, plus `openapi`. fmt, clippy and the
  # tests share the cached dependencies; clippy and test still compile the
  # crate itself separately because clippy emits metadata, not code, and that
  # is the one duplication left.
  rust:
    if: ${{ !(startsWith(github.head_ref, 'changeset-release/') && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      # One cache, not two. sccache was layered on top of this before, with
      # the same GitHub cache as its backend: every compile paid for a cache
      # write and a cold run read 0 hits out of 60, because sccache entries
      # are scoped to the branch exactly like everything else. rust-cache
      # alone restores the whole target directory in one download.
      #
      # `save-if`: only the push runs on main and next write. A PR branch
      # reads its base branch's cache and rebuilds the few crates its own
      # changes touch; letting every PR save its own copy churned the
      # repository's 10GB of cache space and evicted the caches worth having.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/server -> target
          save-if: ${{ github.event_name == 'push' }}

      - run: cargo fmt --all --check

      - run: cargo clippy --all-targets --features openapi --locked -- -D warnings

      - run: cargo test --features openapi --locked

      # `cargo test` above already compiled `gen_openapi` in this profile with
      # this feature set, so this is a link check and a run, not a build. Fail
      # the PR if apps/server/openapi.json is out of sync with the server code.
      - name: Check OpenAPI spec is up to date
        run: |
          cargo run --bin gen_openapi --features openapi --locked
          git diff --exit-code -- openapi.json || \
            (echo "::error::openapi.json is out of date. Run: cd apps/server && cargo run --bin gen_openapi --features openapi" && exit 1)

  # The default build is SQLite, which happily masks Postgres-only breakage
  # (e.g. sqlx type_name/column-type mismatches only fail at decode time on
  # Postgres). The e2e suite runs migrations and the full ingest pipeline
  # against a real Postgres via testcontainers, the only suite that compiles
  # under the postgres feature. Clippy runs here under the same features so a
  # Postgres-only code path gets linted too, which used to live in a third
  # workflow with a third target directory.
  postgres-e2e:
    if: ${{ !(startsWith(github.head_ref, 'changeset-release/') && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/server -> target
          key: postgres
          save-if: ${{ github.event_name == 'push' }}

      - run: cargo clippy --all-targets --no-default-features --features postgres,openapi --locked -- -D warnings

      - name: Run Postgres e2e tests
        run: cargo test --no-default-features --features postgres --locked --test e2e_tests
