name: CI

# One runner per concern, and only dependencies cached.
#
# The whole gate used to be one `turbo run` on one 4-core runner: Vitest, Vite
# and Next next to `cargo build --release`, `cargo clippy`, `cargo check` and
# `cargo test`. Turbo believes cargo tasks run in parallel; cargo does not, they
# queue on the target directory lock, so the four Rust tasks ran one after the
# other with the JavaScript side fighting them for the same cores. And the
# release build, which no check ever read, was 10m50s of a 12m56s run: fat LTO
# with one codegen unit is a single-threaded tail no runner can shorten.
#
# So: four PR-gating jobs, each doing one thing, each on its own runner. The
# wall-clock is the slowest job, not the sum. Coverage is a separate push/manual
# job because badges read main, not a pull request's temporary merge ref.
#
# The Rust jobs restore compiled dependencies (rust-cache, through
# setup-rust-toolchain) and never the workspace crates. A cache is scoped to
# the branch that wrote it plus the PR's base, so only pushes to main and next
# save one: every PR reads its base's, and a branch never writes a cache that
# nothing else can read. A miss is a cold compile, which is correct, just slower.

on:
  # Every pull request, whatever it targets. Deliberately unfiltered: a
  # `branches` filter here matches the PR's *base*, so gating on `main` meant a
  # stacked PR or one onto a long-lived feature branch merged with no checks at
  # all. The work is the same work regardless of where it lands.
  pull_request:
  # Also the two branches releases are cut from. `main` reaches `next` by a
  # plain merge (see release.yml), not a PR, and the merge commit itself is
  # otherwise never checked.
  push:
    branches: [main, next]
  # By hand, for a branch: the same jobs as a push, including coverage and
  # `rust-release`.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a PR supersedes the run in flight. A push to main or next
  # is left to finish: nothing supersedes a release-line commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation trades a slower first build for faster rebuilds of
  # the same tree. CI never rebuilds the same tree.
  CARGO_INCREMENTAL: "0"
  # Full debug info is what makes a test build slow to write and to link, and
  # nothing here runs a debugger. Line tables keep file and line in a panic's
  # backtrace, which is the one thing a failing test needs.
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  # The Rust jobs run package scripts with pnpm but install nothing: without
  # this, `pnpm run` installs the whole workspace before a cargo command.
  pnpm_config_verify_deps_before_run: "false"

# Every job skips the automated "chore: version packages" PR, on main or on a
# prerelease branch (the head is `changeset-release/<branch>`). It only bumps
# versions and writes changelogs, generated by changesets from commits that
# already passed CI. A job skipped by `if` reports as successful to branch
# protection, so required checks still go green. `head_ref` is empty on push
# events, so this never skips a run on main or next.
#
# The same-repo check is what keeps the skip from being a bypass: a fork can
# name its branch anything, but it cannot make its head repository ours.
#
# The Rust jobs call the package scripts `pnpm run ci:rust` runs locally, so a
# command changes in one place.
jobs:
  # ── JavaScript: build, test, lint, format, types, react-doctor ─────────────
  web:
    if: &not-version-pr ${{ !(startsWith(github.head_ref, 'changeset-release/') && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - &setup-pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - &setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # .nvmrc: the Node the dashboard image is built with
          # (apps/dashboard/Dockerfile).
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      # `pnpm install` brings the `playwright` package but not the browser it
      # drives. `@rustrak/ui` runs every story as a component test in a real
      # Chromium, so without this the whole suite fails at `browserType.launch`.
      # `--with-deps` also installs the system libraries Chromium needs.
      - run: pnpm --filter @rustrak/ui exec playwright install --with-deps chromium

      # turbo over every package except the two Rust crates, which have the
      # three jobs below.
      - run: pnpm run ci:web

  # ── Rust: rustfmt, clippy for both backends, the benchmark crate ───────────
  # Clippy compiles dependencies in check mode (metadata only), which is a
  # different set of artifacts from the ones `cargo test` needs, so putting
  # lints and tests in one job would not share a compile. Two runners, half
  # the wall-clock.
  rust-lint:
    if: *not-version-pr
    # The arm64 runner: the same 4 vCPUs, free for a public repository, and
    # measured on one commit against ubuntu-latest: clippy 1m27s against 1m57s,
    # the whole job 2m36s against 3m24s. The arm64 image ships too, so this is
    # one of the two architectures released, not an exotic one.
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: apps/server
    steps:
      - *checkout

      # Rust from rust-toolchain.toml, the same the release images use.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-save-if: ${{ github.event_name == 'push' }}
          cache-workspaces: |
            apps/server -> target
            packages/benchmarks -> target
      - *setup-pnpm
      - *setup-node

      - run: pnpm run format:check

      # The image's Rust comes from its cargo-chef tag, which cannot read
      # rust-toolchain.toml. This keeps the two from drifting apart.
      - name: The server image compiles with the Rust in rust-toolchain.toml
        working-directory: .
        run: |
          channel=$(sed -nE 's/^channel = "(.*)"/\1/p' rust-toolchain.toml)
          grep -Eq "^FROM lukemathwalker/cargo-chef:[^ ]*-rust-${channel//./\\.}-" apps/server/Dockerfile \
            || { echo "::error file=apps/server/Dockerfile::the cargo-chef image is not Rust ${channel}"; exit 1; }

      # The default backend, plus `openapi` so the spec-generating binary is
      # linted too.
      - run: pnpm run lint

      # The other backend. The two compile different `sqlx` drivers and
      # different `cfg(feature = "postgres")` branches; a lint that only sees
      # one of them misses half the queries.
      - run: pnpm run lint:postgres

      # The benchmark CLI is its own crate with its own lockfile (see CLAUDE.md
      # for why it cannot join the server's workspace), held to the same
      # rustfmt and clippy bar. Its tests are seconds once clippy has resolved
      # its dependencies, so they run here rather than on a fifth runner.
      - name: Lint and test the benchmark crate
        working-directory: packages/benchmarks
        run: |
          pnpm run format:check
          pnpm run lint
          pnpm run test

  # ── Rust: the test suites on SQLite, and the OpenAPI drift check ───────────
  rust-test:
    if: *not-version-pr
    # arm64 for the same reason as rust-lint: 3m40s against 4m08s on one
    # commit. postgres-e2e below stays on amd64, so both shipped architectures
    # run the test suite on every PR.
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: apps/server
    steps:
      - *checkout

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-save-if: ${{ github.event_name == 'push' }}
          cache-workspaces: apps/server -> target
      - *setup-pnpm
      - *setup-node

      # `openapi` on, so `gen_openapi` is compiled here, in this profile, and
      # the check below is a run rather than a second compile with a different
      # feature set.
      - run: pnpm run test

      - name: Check OpenAPI spec is up to date
        run: |
          pnpm run openapi:check || \
            (echo "::error::openapi.json is out of date. Run: pnpm --filter @rustrak/server openapi" && exit 1)

  # ── Coverage: uploaded for README badges, off the PR gate ────────────────
  coverage:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Codecov authenticates the upload with a GitHub OIDC token instead of a
    # stored secret.
    permissions:
      contents: read
      id-token: write
    steps:
      - *checkout

      - *setup-pnpm
      - *setup-node

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-save-if: ${{ github.event_name == 'push' }}
          cache-workspaces: apps/server -> target

      - uses: taiki-e/install-action@27cdd3237bf9a6a2b668f3bcbfaa06949ae17deb # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov

      - run: pnpm install --frozen-lockfile

      - name: Generate server coverage
        working-directory: apps/server
        run: cargo llvm-cov --features openapi --locked --lcov --output-path lcov-rust.info

      - name: Generate client coverage
        working-directory: packages/client
        run: pnpm test:coverage

      - name: Upload server coverage
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: apps/server/lcov-rust.info
          flags: rust
          name: rust
          use_oidc: true
          fail_ci_if_error: true

      - name: Upload client coverage
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: packages/client/coverage/lcov.info
          flags: typescript
          name: typescript
          use_oidc: true
          fail_ci_if_error: true

  # ── Rust: the release profile, on the release lines only ───────────────────
  # Fat LTO with one codegen unit is a different compile from the test profile:
  # a `cfg(debug_assertions)` branch, a link-time failure, a warning that only
  # optimisation raises. It is what docker-publish.yml compiles at release
  # time, and it was the ten-minute step that left the PR gate. So it runs on
  # every push to main and next instead (and on a manual dispatch), where
  # nobody waits for it, and a release never finds out first. One runner per
  # backend: the crate itself is the slow part under LTO and it does not
  # parallelise.
  rust-release:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        features: [sqlite, postgres]
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: apps/server
    steps:
      - *checkout

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-save-if: ${{ github.event_name == 'push' }}
          cache-workspaces: apps/server -> target
          cache-key: ${{ matrix.features }}

      - run: cargo build --release --locked --no-default-features --features ${{ matrix.features }}

  # ── Rust: the e2e suite on a real PostgreSQL ───────────────────────────────
  # The default build is SQLite, which happily masks Postgres-only breakage
  # (e.g. sqlx type_name/column-type mismatches only fail at decode time on
  # Postgres). The e2e suite runs migrations and the full ingest pipeline
  # against a real Postgres via testcontainers, the only suite that compiles
  # under the postgres feature.
  postgres-e2e:
    if: *not-version-pr
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - *checkout

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-save-if: ${{ github.event_name == 'push' }}
          cache-workspaces: apps/server -> target
      - *setup-pnpm
      - *setup-node

      - run: pnpm run test:postgres:e2e
