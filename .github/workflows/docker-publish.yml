name: Docker Publish

# Three images, two architectures, one job definition.
#
# Every image is built once per architecture on a native runner (no QEMU) and
# pushed by digest; a second job per image then stitches the digests into one
# multi-platform manifest list and gives it its tags. That is Docker's own
# recipe for distributing a multi-platform build across runners, and it is
# what ran before too, as six hand-copied jobs. The `build` matrix below is the
# same six builds, and `manifest` the same three merges, written once.
#
# No layer cache. A release runs on its tag, a ref no earlier run was ever on,
# so the `type=gha` cache-from never hit; each run still paid to export six
# `mode=max` caches into the repository's 10 GB and evict whatever else was
# there. The compile is the same compile either way, and it starts from
# nothing: the dependency layer took about two minutes less once cargo-chef
# stopped being compiled from source first (apps/server/Dockerfile).

on:
  release:
    types: [published]
  # For a release whose publish failed halfway: re-run it for the same tag
  # without cutting a new version. Every job checks out the tag, and the npm
  # step skips a version the registry already has, so a re-run only fills in
  # what is missing.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.15.0-rc.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  # id-token: write is required for npm provenance attestation. The Pages
  # permissions that used to live here moved to deploy-docs.yml along with the
  # job that needed them.
  id-token: write

jobs:
  # The published artifacts (server, dashboard, client, mcp) are a `fixed` group
  # in .changeset/config.json: one version, one tag, one release, everything
  # ships together. So there is nothing to detect, we only need the version off
  # the tag. `docs` is outside the group, versioned on its own and deployed by
  # deploy-docs.yml, which listens for the same `release: published` event.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      channel: ${{ steps.check.outputs.channel }}
    steps:
      # `channel` is which moving tags this build takes. A stable `vX.Y.Z`
      # moves `latest` (and `postgres`) and lands on npm's `latest` dist-tag.
      # A prerelease `vX.Y.Z-rc.N`, cut by release.yml from the `next` branch,
      # moves `next` (and `next-postgres`) and publishes under npm's `next`
      # dist-tag, so nobody pulling `latest` or running
      # `npm install @rustrak/client` picks up a release candidate by accident.
      - name: Extract version from release tag
        id: check
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          echo "Release tag: $TAG"

          VERSION=$(echo "$TAG" | grep -oE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' | sed 's/^v//')
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not extract semver version from tag '$TAG'. Expected format: vX.Y.Z or vX.Y.Z-rc.N"
            exit 1
          fi

          # A hyphen is semver's prerelease marker. The release's own flag
          # would say the same, but the tag is what release.yml decided from.
          if [[ "$VERSION" == *-* ]]; then
            CHANNEL=next
          else
            CHANNEL=latest
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION on channel $CHANNEL"

  # ── Build: one image, one architecture, one native runner ────────────────────
  # `image` and `platform` are the matrix axes. The `include` entries only
  # attach data to the combinations those axes already produce: a runner to
  # each platform, and a Dockerfile, a context and a repository to each image.
  # An `include` that introduced a new key on its own would be merged into
  # every combination in turn.
  #
  # The dashboard ships twice: compiled into the server image, which is the
  # default deployment, and as `rustrak/rustrak-ui`, nginx serving the same
  # bundle and proxying the API, for an installation that keeps the dashboard
  # on a different host from its server. The UI Dockerfile builds its own copy
  # from the workspace; the server image takes it from `apps/server/static`,
  # which only the JavaScript build writes. Without those steps the published
  # server image would be API-only: correct, silent, and the worst kind of
  # missing UI.
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        image: [server-sqlite, server-postgres, ui]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: server-sqlite
            repository: rustrak/rustrak-server
            context: ./apps/server
            file: ./apps/server/Dockerfile
            build-args: FEATURES=sqlite
            dashboard: bundle
          - image: server-postgres
            repository: rustrak/rustrak-server
            context: ./apps/server
            file: ./apps/server/Dockerfile
            build-args: FEATURES=postgres
            dashboard: bundle
          - image: ui
            repository: rustrak/rustrak-ui
            context: .
            file: ./apps/dashboard/Dockerfile
            build-args: ""
            dashboard: in-image
    name: build (${{ matrix.image }}, ${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: matrix.dashboard == 'bundle'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.dashboard == 'bundle'
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
        if: matrix.dashboard == 'bundle'
      # Through turbo, not `pnpm --filter`: the dashboard imports
      # `@rustrak/client` from the workspace, and turbo's `^build` compiles it
      # first. A bare `--filter` build finds no `dist/` there and Vite fails to
      # resolve the import.
      - name: Build the dashboard into the server's build context
        if: matrix.dashboard == 'bundle'
        run: |
          pnpm turbo run build --filter=@rustrak/dashboard
          bash scripts/bundle-dashboard.sh

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The telemetry key is a BuildKit secret the server Dockerfile mounts at
      # compile time (see there); the UI image has no use for it and is not
      # handed it.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ matrix.build-args }}
          secrets: ${{ matrix.dashboard == 'bundle' && format('rustrak_telemetry_key={0}', secrets.RUSTRAK_TELEMETRY_KEY) || '' }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          tags: ${{ matrix.repository }}

      # One empty file named after the digest, so the manifest job can list a
      # directory and get its arguments.
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Name the artifact after the platform
        id: artifact
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "name=digests-${{ matrix.image }}-${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Manifest: the two digests of an image become one tagged manifest list ──
  manifest:
    needs: [version, build]
    strategy:
      fail-fast: false
      matrix:
        image: [server-sqlite, server-postgres, ui]
    name: manifest (${{ matrix.image }})
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      # The version tag is immutable; the second tag is the moving one for the
      # channel. The stable moving tag for postgres is `postgres`, not
      # `latest-postgres`.
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          set -euo pipefail
          case "$IMAGE" in
            server-sqlite)
              REPO=rustrak/rustrak-server
              PINNED="v${VERSION}"
              MOVING="${CHANNEL}"
              ;;
            server-postgres)
              REPO=rustrak/rustrak-server
              PINNED="v${VERSION}-postgres"
              if [[ "$CHANNEL" == "latest" ]]; then MOVING=postgres; else MOVING="${CHANNEL}-postgres"; fi
              ;;
            ui)
              REPO=rustrak/rustrak-ui
              PINNED="v${VERSION}"
              MOVING="${CHANNEL}"
              ;;
            *)
              echo "::error::unknown image '$IMAGE'"; exit 1 ;;
          esac
          docker buildx imagetools create \
            -t "${REPO}:${PINNED}" \
            -t "${REPO}:${MOVING}" \
            $(printf "${REPO}@sha256:%s " *)
          docker buildx imagetools inspect "${REPO}:${PINNED}"

  # ── npm publish ───────────────────────────────────────────────────────────────

  publish-npm:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      # mcp depends on client, so client must build first.
      - name: Build packages
        run: pnpm --filter @rustrak/client build && pnpm --filter @rustrak/mcp build

      # `--tag` is the dist-tag. Without it npm points `latest` at whatever was
      # published last, prerelease included, and `npm install @rustrak/client`
      # would hand out a release candidate.
      # A version already on the registry is skipped rather than failed, so a
      # re-run of a half-published release gets past the half that worked.
      - name: Publish @rustrak/client
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "@rustrak/client@$VERSION" version >/dev/null 2>&1; then
            echo "@rustrak/client@$VERSION is already published, skipping"
          else
            pnpm --filter @rustrak/client publish --no-git-checks --access public --tag "$CHANNEL"
          fi

      - name: Publish @rustrak/mcp
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "@rustrak/mcp@$VERSION" version >/dev/null 2>&1; then
            echo "@rustrak/mcp@$VERSION is already published, skipping"
          else
            pnpm --filter @rustrak/mcp publish --no-git-checks --access public --tag "$CHANNEL"
          fi
