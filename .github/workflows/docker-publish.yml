name: Docker Publish

# Compile once, on native runners, then assemble.
#
# Every image used to compile the server inside `docker build`, on each of
# four runners (two backends, two architectures), each one also running
# `pnpm install` and a dashboard build of its own first. The Rust compile in a
# Docker layer has no compiler cache: a `type=gha` layer cache is scoped to
# the git ref the run is on, a release runs on its tag, and no two releases
# share a tag. So every release compiled every dependency from source, four
# times, inside the emulation-free but cache-free layer, and took seven minutes
# per image doing it.
#
# Now the dashboard builds once and the server compiles once per backend and
# architecture, with cargo on the runner and rust-cache keeping the dependency
# artifacts from one release to the next. The Dockerfiles take the finished
# binary and the finished bundle from the build context (`BINARY_SOURCE=` and
# `DIST_SOURCE=prebuilt`), so a multi-platform image is a handful of COPYs
# that buildx does in one job with no QEMU.
#
# The compile runs in the `rust:1.94-bookworm` container rather than on the
# runner's Ubuntu: the runtime image is distroless *Debian 12*, and a binary
# linked against Ubuntu 24.04's newer glibc would not start there. Same
# distribution in, same distribution out.

on:
  # Called by release.yml right after it creates the GitHub release. Running
  # inside that push-triggered run is what gives these jobs a cache to read:
  # the run is on `main` or `next`, the branch the previous release also ran
  # on, instead of on a tag nothing ran on before.
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.15.0-rc.0"
        required: true
        type: string
  # For a release whose publish failed halfway: re-run it for the same tag
  # without cutting a new version. Every job checks out the tag, and the npm
  # step skips a version the registry already has, so a re-run only fills in
  # what is missing.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.15.0-rc.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  # id-token: write is required for npm provenance attestation. The Pages
  # permissions that used to live here moved to deploy-docs.yml along with the
  # job that needed them.
  id-token: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # The published artifacts (server, dashboard, client, mcp) are a `fixed` group
  # in .changeset/config.json: one version, one tag, one release, everything
  # ships together. So there is nothing to detect, we only need the version off
  # the tag. `docs` is outside the group, versioned on its own and deployed by
  # deploy-docs.yml, which listens for the `release: published` event.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      channel: ${{ steps.check.outputs.channel }}
    steps:
      # `channel` is which moving tags this build takes. A stable `vX.Y.Z`
      # moves `latest` (and `postgres`) and lands on npm's `latest` dist-tag.
      # A prerelease `vX.Y.Z-rc.N`, cut by release.yml from the `next` branch,
      # moves `next` (and `next-postgres`) and publishes under npm's `next`
      # dist-tag, so nobody pulling `latest` or running
      # `npm install @rustrak/client` picks up a release candidate by accident.
      - name: Extract version from release tag
        id: check
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "Release tag: $TAG"

          VERSION=$(echo "$TAG" | grep -oE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' | sed 's/^v//')
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not extract semver version from tag '$TAG'. Expected format: vX.Y.Z or vX.Y.Z-rc.N"
            exit 1
          fi

          # A hyphen is semver's prerelease marker. The release's own flag
          # would say the same, but the tag is what release.yml decided from.
          if [[ "$VERSION" == *-* ]]; then
            CHANNEL=next
          else
            CHANNEL=latest
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION on channel $CHANNEL"

  # ── The dashboard, built once ────────────────────────────────────────────────
  # The same `dist/` ships twice: compiled into the server image, which the
  # server hands out itself, and as `rustrak/rustrak-ui`, nginx serving the
  # same bundle and proxying the API for an installation that keeps the
  # dashboard on a different host. Static files have no architecture, so one
  # build feeds every image on every platform.
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Through turbo, not `pnpm --filter`: the dashboard imports
      # `@rustrak/client` from the workspace, and turbo's `^build` compiles it
      # first. A bare `--filter` build finds no `dist/` there and Vite fails to
      # resolve the import.
      - run: pnpm turbo run build --filter=@rustrak/dashboard

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-dist
          path: apps/dashboard/dist
          if-no-files-found: error
          retention-days: 1

  # ── The server binary, once per backend and architecture ─────────────────────
  # Native runners for both architectures, no cross-compilation and no QEMU.
  # The cache key carries the backend; rust-cache adds the OS and architecture
  # itself, so the four combinations keep four caches that never collide.
  #
  # `platform` is a matrix axis and `include` only attaches a runner to each
  # value. An `include` that introduced `platform` itself would be merged into
  # every combination in turn, and the last one would win.
  server-binary:
    strategy:
      fail-fast: false
      matrix:
        features: [sqlite, postgres]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # See the header: the runtime image is Debian 12, so the binary is linked
    # against Debian 12's glibc. The full image, not `-slim`, because sqlx's
    # bundled SQLite is C and needs a C compiler.
    container: rust:1.94-bookworm
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/server -> target
          key: release-${{ matrix.features }}

      - run: cargo build --release --locked --no-default-features --features ${{ matrix.features }}

      - name: Name the artifact after its platform
        id: name
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "artifact=rustrak-${{ matrix.features }}-${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: apps/server/target/release/rustrak
          if-no-files-found: error
          retention-days: 1

  # ── Server images ────────────────────────────────────────────────────────────
  # One job per backend builds both platforms at once and pushes the manifest
  # list directly. The Dockerfile's `prebuilt` stage reads
  # `prebuilt/<TARGETPLATFORM>/rustrak` from the context, so the two binaries
  # only have to be laid out under the platform names buildx will ask for.
  docker-server:
    needs: [version, dashboard, server-binary]
    strategy:
      fail-fast: false
      matrix:
        features: [sqlite, postgres]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-dist
          path: apps/dashboard/dist

      # The image serves `apps/server/static` at `/`, and that directory is
      # written by `scripts/bundle-dashboard.sh` from the dashboard's `dist/`.
      # Without this step the published image would be API-only: correct,
      # silent, and the worst kind of missing UI.
      - run: bash scripts/bundle-dashboard.sh

      # Each binary arrives in a directory named after its artifact,
      # `rustrak-<features>-linux-<arch>/rustrak`. The Dockerfile wants
      # `prebuilt/linux/<arch>/rustrak`, the TARGETPLATFORM spelling. Artifacts
      # do not keep file modes, hence the chmod.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rustrak-${{ matrix.features }}-*
          path: apps/server/prebuilt
      - name: Lay the binaries out by platform
        working-directory: apps/server/prebuilt
        run: |
          set -euo pipefail
          for bin in rustrak-${{ matrix.features }}-linux-*/rustrak; do
            dir="${bin%/rustrak}"
            arch="${dir##*-linux-}"
            mkdir -p "linux/$arch"
            mv "$bin" "linux/$arch/rustrak"
            chmod 755 "linux/$arch/rustrak"
            rmdir "$dir"
          done
          find . -type f -exec ls -l {} +

      # The stable moving tag for postgres is `postgres`, not `latest-postgres`.
      - name: Compute image tags
        id: tags
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          FEATURES: ${{ matrix.features }}
        run: |
          set -euo pipefail
          if [[ "$FEATURES" == "sqlite" ]]; then
            SUFFIX=""
            MOVING="$CHANNEL"
          elif [[ "$CHANNEL" == "latest" ]]; then
            SUFFIX="-postgres"
            MOVING="postgres"
          else
            SUFFIX="-postgres"
            MOVING="${CHANNEL}-postgres"
          fi
          {
            echo "tags<<EOF"
            echo "rustrak/rustrak-server:v${VERSION}${SUFFIX}"
            echo "rustrak/rustrak-server:${MOVING}"
            echo "EOF"
            echo "primary=rustrak/rustrak-server:v${VERSION}${SUFFIX}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # No layer cache: nothing here is worth caching. The only layers are the
      # binary and the bundle, both fresh by definition.
      - name: Build and push (${{ matrix.features }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./apps/server
          platforms: linux/amd64,linux/arm64
          build-args: |
            BINARY_SOURCE=prebuilt
            FEATURES=${{ matrix.features }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ steps.tags.outputs.primary }}

  # ── UI image ─────────────────────────────────────────────────────────────────
  # The bundle the `dashboard` job built, behind nginx. Build context is the
  # repository root, because that is where the Dockerfile's from-source path
  # expects the workspace; the prebuilt path only reads `apps/dashboard/dist`.
  docker-ui:
    needs: [version, dashboard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-dist
          path: apps/dashboard/dist

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./apps/dashboard/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: DIST_SOURCE=prebuilt
          push: true
          tags: |
            rustrak/rustrak-ui:v${{ needs.version.outputs.version }}
            rustrak/rustrak-ui:${{ needs.version.outputs.channel }}

      - name: Inspect image
        run: docker buildx imagetools inspect rustrak/rustrak-ui:v${{ needs.version.outputs.version }}

  # ── npm publish ───────────────────────────────────────────────────────────────

  publish-npm:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      # mcp depends on client, so client must build first.
      - name: Build packages
        run: pnpm --filter @rustrak/client build && pnpm --filter @rustrak/mcp build

      # `--tag` is the dist-tag. Without it npm points `latest` at whatever was
      # published last, prerelease included, and `npm install @rustrak/client`
      # would hand out a release candidate.
      # A version already on the registry is skipped rather than failed, so a
      # re-run of a half-published release gets past the half that worked.
      - name: Publish @rustrak/client
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          if npm view "@rustrak/client@$VERSION" version >/dev/null 2>&1; then
            echo "@rustrak/client@$VERSION is already published, skipping"
          else
            pnpm --filter @rustrak/client publish --no-git-checks --access public --tag "${{ needs.version.outputs.channel }}"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @rustrak/mcp
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          if npm view "@rustrak/mcp@$VERSION" version >/dev/null 2>&1; then
            echo "@rustrak/mcp@$VERSION is already published, skipping"
          else
            pnpm --filter @rustrak/mcp publish --no-git-checks --access public --tag "${{ needs.version.outputs.channel }}"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
