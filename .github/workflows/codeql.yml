name: "CodeQL SAST"

on:
  push:
    branches: ["main"]
    paths:
      - "apps/server/**"
      - "apps/dashboard/**"
      - "packages/**"
      - ".github/workflows/codeql.yml"
  # No `branches` filter: it matches the PR's base, and a PR onto a feature
  # branch carries the same code as one onto main. `paths` still applies.
  pull_request:
    paths:
      - "apps/server/**"
      - "apps/dashboard/**"
      - "packages/**"
  schedule:
    - cron: "27 3 * * 1" # Weekly Monday 03:27 UTC
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Skip the automated "chore: version packages" PR - see ci.yml.
    if: ${{ !(startsWith(github.head_ref, 'changeset-release/') && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "language:${{ matrix.language }}"
