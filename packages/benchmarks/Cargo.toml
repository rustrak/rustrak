[package]
name = "rustrak-benchmarks"
version = "0.1.0"
edition = "2021"
description = "Benchmark suite for Rustrak server"
authors = ["Rustrak Team"]

[[bin]]
name = "rustrak-bench"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.53.1", features = ["full"] }

# HTTP client
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls",
    "gzip",
    "json",
] }

# CLI
clap = { version = "4.6.7", features = ["derive", "env"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"

# Docker API for metrics
bollard = "0.21.1"

# PostgreSQL client for pg_stat_* collection
tokio-postgres = { version = "0.7.18", features = [
    "with-serde_json-1",
    "with-chrono-0_4",
] }

# Latency histograms
hdrhistogram = "7.6.0"

# Time handling
chrono = { version = "0.4.45", features = ["serde"] }

# UUID generation
uuid = { version = "1.26.1", features = ["v4"] }

# Compression
flate2 = "1.1.10"

# Async utilities
futures = "0.3.34"

# Error handling
thiserror = "2.0.21"
anyhow = "1.0.104"

# Colored output
colored = "3.1.1"

# Progress bars
indicatif = "0.18.6"

# Random number generation
rand = "0.10.3"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
