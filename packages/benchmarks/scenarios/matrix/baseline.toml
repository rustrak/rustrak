# Baseline latency
#
# One request per second. Nothing is contended, so this isolates the per-request
# cost of the ingest path when the database is completely idle - the floor that
# the loaded scenarios are measured against.

name = "baseline"
description = "Per-request latency floor with an idle database"
scenario_type = "baseline"

duration_secs = 60
target_rps = 1
concurrency = 1
warmup_secs = 5

[event]
breadcrumb_count = 5
stack_depth = 10
include_user = true
include_tags = true
include_extra = false
distinct_groups = 300
