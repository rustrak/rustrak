# The Rust side of the plugin: everything under src/server/. Its crate root,
# .rustrak/lib.rs, is written by rustrak-plugin from those folders.
[package]
name = "web-traffic"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = ".rustrak/lib.rs"
crate-type = ["cdylib"]

[dependencies]
getrandom = "0.3"
rustrak-plugin = { path = "../../packages/rustrak-plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"

# A plugin builds on its own, never as part of a parent workspace.
[workspace]
